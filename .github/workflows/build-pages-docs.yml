name: Build GitHub Pages docs

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/build-pages-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages output
        run: npm run build

      - name: Commit generated docs for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No generated docs changes."
          else
            git commit -m "Build GitHub Pages output"
            git push origin HEAD:master
          fi
