name: Deploy to Surge

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: |
          npm run build
          cp dist/index.html dist/200.html

      - name: Deploy to Surge
        run: npx surge dist identidade-oculta.surge.sh --token ${{ secrets.SURGE_TOKEN }}
